<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Watch-it</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <header>
      <h1>Watch-it</h1>
      <div class="budget-setting">
        <label for="budgetInput">Your budget: $</label>
        <input type="number" id="budgetInput" placeholder="e.g. 2000">
      </div>
    </header>

    <section class="search-section">
      <input type="text" id="searchInput" placeholder="Search a watch (brand or model)...">
      <div id="searchResults" class="watch-grid"></div>
    </section>

    <section class="lists-section">
      <div class="list-column">
        <h2>Want List — <span id="wantTotal">$0</span></h2>
        <div id="wantList" class="watch-grid"></div>
      </div>
      <div class="list-column">
        <h2>Have List</h2>
        <div id="haveList" class="watch-grid"></div>
      </div>
    </section>

    <!-- The interrupt overlay — hidden until the want list exceeds budget -->
    <div id="interruptOverlay" class="overlay hidden">
      <div class="overlay-content">
        <p id="interruptQuote"></p>
        <button id="dismissBtn">Okay, fair.</button>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
